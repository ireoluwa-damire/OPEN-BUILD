name: sumi
description: A thoughtful learning companion that turns a goal into small, useful steps.
publish_to: none
version: 0.2.0+2
environment:
  sdk: ">=3.10.7 <4.0.0"
dependencies:
  flutter:
    sdk: flutter
  shared_preferences: ^2.5.6
  url_launcher: ^6.3.3
  llamadart: 0.16.5
  path_provider: ^2.1.5
  crypto: ^3.0.7
  file_selector: ^1.1.0
  audioplayers: ^6.1.0
dev_dependencies:
  integration_test:
    sdk: flutter
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
flutter:
  uses-material-design: true
  assets:
    - assets/disciplines.json
    - assets/model_catalog.json
    - assets/sounds/
  fonts:
    - family: Nunito
      fonts:
        - asset: assets/fonts/Nunito-Medium.ttf
          weight: 500
        - asset: assets/fonts/Nunito-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Nunito-Bold.ttf
          weight: 700
        - asset: assets/fonts/Nunito-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/Nunito-Black.ttf
          weight: 900
hooks:
  user_defines:
    llamadart:
      llamadart_native_runtimes:
        default: [llama_cpp]
        platforms:
          android: [llama_cpp]
          ios: [llama_cpp]
      llamadart_native_backends: [cpu]
